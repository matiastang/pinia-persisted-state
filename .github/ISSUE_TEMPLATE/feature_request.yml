name: ✨ 功能建议 / Feature Request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与动机 / Use Case & Motivation
      description: 你想解决什么问题？当前做法有什么不便？ / What problem are you trying to solve? What's inconvenient today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed Solution
      description: 你希望的功能形态或 API 用法示例 / What the feature should look like, ideally with an API usage example
      placeholder: |
        ```ts
        persist({
          // 期望支持的配置 / desired option
        })
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 你考虑过的其他方案或临时变通办法 / Other solutions or workarounds you've considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 相关资料、同类库的做法等 / Related references, how similar libraries handle it
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: 是否愿意参与实现 / Willing to Contribute?
      options:
        - 暂不 / Not at the moment
        - 愿意提交 PR / Yes, I'd like to submit a PR
    validations:
      required: false
